aid: tingsn
name: Tingsn
description: Jiangsu Tingsn Technology (霆升科技) is a Nanjing, China medical-device
  company focused on ultrasound for cardiac electrophysiology and structural heart
  disease. It develops intracardiac echocardiography (ICE) products, including the
  TINGSN Sonic Eyes line of disposable 2D ICE diagnostic catheters — among the first
  domestically developed ICE catheters approved by China's NMPA (registration 2023)
  — and TINGSN FINDERS portable color ultrasound systems, with 4D ICE, ultrasound
  3D mapping, and ultrasound ablation platforms in development. Backed by Qiming Venture
  Partners with R&D centers in Nanjing and Massachusetts, Tingsn is a clinical hardware
  company and publishes no public API or developer program.
